<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | BarberBook Admin</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Admin Custom CSS -->
    <link rel="stylesheet" href="../../assets/css/admin.css">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <div class="admin-sidebar" id="adminSidebar">
        <div class="brand">
            <div>
                <a href="../../index.html" class="text-decoration-none brand-text">
                    <i class="fa-solid fa-scissors me-2"></i>BARBERBOOK
                </a>
                <p class="small text-muted mb-0 mt-1" style="color: #a1a5b7 !important;">Panel Administrativo</p>
            </div>
            <button class="btn-close-sidebar" id="btnCloseSidebar"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <ul class="nav flex-column nav-admin">
            <li class="nav-item">
                <a class="nav-link active" href="dashboard.html">
                    <i class="fa-solid fa-chart-line"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="citas.html">
                    <i class="fa-solid fa-calendar-check"></i> Gestión de Citas
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-muted" href="#" onclick="alert('Módulo en desarrollo para la próxima versión.'); return false;">
                    <i class="fa-solid fa-list"></i> Servicios
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-muted" href="#" onclick="alert('Módulo en desarrollo para la próxima versión.'); return false;">
                    <i class="fa-solid fa-users"></i> Barberos
                </a>
            </li>
            <li class="nav-item mt-5">
                <a class="nav-link text-danger" href="../../index.html">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Salir del Panel
                </a>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="admin-main">
        <div class="admin-header">
            <div class="d-flex align-items-center">
                <button class="admin-toggler-btn" id="btnToggleSidebar"><i class="fa-solid fa-bars"></i></button>
                <h2 class="admin-title">Resumen General</h2>
            </div>
            <div id="fecha-actual"><i class="fa-regular fa-calendar me-2"></i>...</div>
        </div>

        <!-- Stats Row -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="admin-card stat-card">
                    <div class="stat-icon">
                        <i class="fa-solid fa-calendar-day"></i>
                    </div>
                    <div class="stat-details">
                        <h3 id="stat-hoy">0</h3>
                        <p>Citas para Hoy</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="admin-card stat-card">
                    <div class="stat-icon warning">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                    </div>
                    <div class="stat-details">
                        <h3 id="stat-pendientes">0</h3>
                        <p>Pendientes</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="admin-card stat-card">
                    <div class="stat-icon success">
                        <i class="fa-solid fa-check-double"></i>
                    </div>
                    <div class="stat-details">
                        <h3 id="stat-completadas">0</h3>
                        <p>Completadas</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="admin-card stat-card">
                    <div class="stat-icon info">
                        <i class="fa-solid fa-sack-dollar"></i>
                    </div>
                    <div class="stat-details">
                        <h3 id="stat-ingresos">0 Bs</h3>
                        <p>Ingresos Proyectados</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recent Appointments -->
        <div class="admin-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="admin-title fs-4">Próximas Citas</h4>
                <a href="citas.html" class="btn btn-outline-gold btn-sm"><i class="fa-solid fa-list me-2"></i>Ver todas</a>
            </div>
            <div class="table-responsive">
                <table class="table table-admin mb-0">
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Servicio</th>
                            <th>Barbero</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-proximas-citas">
                        <!-- Citas inyectadas con JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/admin.js"></script>
</body>
</html>
