<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Citas | BarberBook Admin</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <div class="admin-sidebar" id="adminSidebar">
        <div class="brand">
            <div>
                <a href="../../index.html" class="text-decoration-none brand-text">
                    <i class="fa-solid fa-scissors me-2"></i>BARBERBOOK
                </a>
                <p class="small text-muted mb-0 mt-1" style="color: #a1a5b7 !important;">Panel Administrativo</p>
            </div>
            <button class="btn-close-sidebar" id="btnCloseSidebar"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <ul class="nav flex-column nav-admin">
            <li class="nav-item">
                <a class="nav-link" href="dashboard.html">
                    <i class="fa-solid fa-chart-line"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="citas.html">
                    <i class="fa-solid fa-calendar-check"></i> Gestión de Citas
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="calendario.html">
                    <i class="fa-solid fa-calendar-days"></i> Calendario
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-muted" href="#" onclick="alert('Módulo en desarrollo.'); return false;">
                    <i class="fa-solid fa-list"></i> Servicios
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-muted" href="#" onclick="alert('Módulo en desarrollo.'); return false;">
                    <i class="fa-solid fa-users"></i> Barberos
                </a>
            </li>
            <li class="nav-item mt-5">
                <a class="nav-link text-danger" href="../../index.html">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Salir del Panel
                </a>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="admin-main">
        <div class="admin-header">
            <div class="d-flex align-items-center">
                <button class="admin-toggler-btn" id="btnToggleSidebar"><i class="fa-solid fa-bars"></i></button>
                <h2 class="admin-title">Todas las Citas</h2>
            </div>
            <div>
                <select class="form-select text-white" style="background-color: #1f1f1f; border: 1px solid rgba(255, 255, 255, 0.08);" id="filtro-estado">
                    <option value="todas">Todos los estados</option>
                    <option value="pendiente">Pendientes</option>
                    <option value="completada">Completadas</option>
                    <option value="cancelada">Canceladas</option>
                </select>
            </div>
        </div>

        <div class="admin-card">
            <div class="table-responsive">
                <table class="table table-admin mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Servicio</th>
                            <th>Barbero</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Estado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-todas-citas">
                        <!-- Inyectado por JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Confirmación -->
    <div class="modal fade" id="confirmarAccionModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: #1f1f1f; border: 1px solid rgba(201, 163, 91, 0.3);">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" style="color: #C9A35B; font-family: 'Cinzel', serif;" id="modalAccionTitulo">Confirmar Acción</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-white">
                    <p id="modalAccionMensaje">¿Estás seguro de continuar?</p>
                    <input type="hidden" id="input-accion-id">
                    <input type="hidden" id="input-accion-tipo">
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-gold" id="btn-confirmar-accion">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/admin.js"></script>
</body>
</html>
