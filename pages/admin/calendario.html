<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de Reservas | BarberBook Admin</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Admin Custom CSS -->
    <link rel="stylesheet" href="../../assets/css/admin.css">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!-- FullCalendar CSS -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />

    <style>
        /* Custom styles to match the premium dark look for the calendar */
        #calendar {
            background: var(--bg-black, #151515);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .fc-theme-standard .fc-scrollgrid {
            border-color: rgba(255,255,255,0.1);
        }
        .fc-theme-standard td, .fc-theme-standard th {
            border-color: rgba(255,255,255,0.1);
        }
        .fc-col-header-cell-cushion, .fc-daygrid-day-number {
            color: #C9A35B; /* Gold */
            text-decoration: none;
        }
        .fc-button-primary {
            background-color: #C9A35B !important;
            border-color: #C9A35B !important;
            color: #151515 !important;
            font-weight: 600;
        }
        .fc-button-primary:not(:disabled):active, .fc-button-primary:not(:disabled).fc-button-active {
            background-color: #b59250 !important;
            border-color: #b59250 !important;
        }
        .fc-event {
            border: none;
            border-radius: 8px;
            padding: 6px 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }
        .fc-event:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
        }
        .fc-event-time {
            font-weight: bold;
            color: rgba(0,0,0,0.7) !important;
            margin-bottom: 2px;
        }
        .fc-event-title {
            font-weight: 600;
            color: #151515 !important;
            font-size: 0.95rem;
            line-height: 1.2;
            white-space: normal; /* Permite saltos de línea para que se lea mejor */
        }
    </style>
</head>
<body>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <div class="admin-sidebar" id="adminSidebar">
        <div class="brand">
            <div>
                <a href="../../index.html" class="text-decoration-none brand-text">
                    <i class="fa-solid fa-scissors me-2"></i>BARBERBOOK
                </a>
                <p class="small text-muted mb-0 mt-1" style="color: #a1a5b7 !important;">Panel Administrativo</p>
            </div>
            <button class="btn-close-sidebar" id="btnCloseSidebar"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <ul class="nav flex-column nav-admin">
            <li class="nav-item">
                <a class="nav-link" href="dashboard.html">
                    <i class="fa-solid fa-chart-line"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="citas.html">
                    <i class="fa-solid fa-list-check"></i> Gestión de Citas
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="calendario.html">
                    <i class="fa-solid fa-calendar-days"></i> Calendario
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-muted" href="#" onclick="alert('Módulo en desarrollo para la próxima versión.'); return false;">
                    <i class="fa-solid fa-list"></i> Servicios
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-muted" href="#" onclick="alert('Módulo en desarrollo para la próxima versión.'); return false;">
                    <i class="fa-solid fa-users"></i> Barberos
                </a>
            </li>
            <li class="nav-item mt-5">
                <a class="nav-link text-danger" href="../../index.html">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Salir del Panel
                </a>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="admin-main">
        <div class="admin-header d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <button class="admin-toggler-btn" id="btnToggleSidebar"><i class="fa-solid fa-bars"></i></button>
                <h2 class="admin-title">Calendario de Reservas</h2>
            </div>
            <button class="btn btn-gold btn-sm"><i class="fa-solid fa-plus me-2"></i>Nueva Reserva</button>
        </div>

        <div class="admin-card mt-4">
            <div id='calendar'></div>
        </div>
    </div>

    <!-- Modal Detalles de Cita -->
    <div class="modal fade" id="citaModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: var(--bg-black, #151515); border: 1px solid rgba(201, 163, 91, 0.3);">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" style="color: #C9A35B; font-family: 'Cinzel', serif;">Detalles de la Cita</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-white">
                    <ul class="list-group list-group-flush rounded" style="background-color: rgba(255,255,255,0.05);">
                        <li class="list-group-item bg-transparent text-white border-secondary">
                            <i class="fa-solid fa-user me-2" style="color: #C9A35B;"></i> <strong>Cliente:</strong> <span id="modalCliente"></span>
                        </li>
                        <li class="list-group-item bg-transparent text-white border-secondary">
                            <i class="fa-solid fa-scissors me-2" style="color: #C9A35B;"></i> <strong>Servicio:</strong> <span id="modalServicio"></span>
                        </li>
                        <li class="list-group-item bg-transparent text-white border-secondary">
                            <i class="fa-solid fa-user-tie me-2" style="color: #C9A35B;"></i> <strong>Barbero:</strong> <span id="modalBarbero"></span>
                        </li>
                        <li class="list-group-item bg-transparent text-white border-secondary">
                            <i class="fa-solid fa-phone me-2" style="color: #C9A35B;"></i> <strong>Teléfono:</strong> <span id="modalTelefono"></span>
                        </li>
                        <li class="list-group-item bg-transparent text-white border-secondary">
                            <i class="fa-solid fa-calendar-check me-2" style="color: #C9A35B;"></i> <strong>Estado:</strong> <span id="modalEstado" class="badge bg-secondary text-uppercase ms-2"></span>
                        </li>
                    </ul>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cerrar</button>
                    <!-- Aquí podrías poner botones de Editar/Cancelar cita en el futuro -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- FullCalendar JS -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/es.js'></script>

    <!-- JS -->
    <script src="../../assets/js/storage.js"></script>
    <script src="../../assets/js/admin-calendar.js"></script>
    <script>
        // Basic sidebar toggle logic for this page
        document.getElementById('btnToggleSidebar').addEventListener('click', () => {
            document.getElementById('adminSidebar').classList.toggle('show');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        });
        document.getElementById('btnCloseSidebar').addEventListener('click', () => {
            document.getElementById('adminSidebar').classList.remove('show');
            document.getElementById('sidebarOverlay').classList.remove('show');
        });
        document.getElementById('sidebarOverlay').addEventListener('click', () => {
            document.getElementById('adminSidebar').classList.remove('show');
            document.getElementById('sidebarOverlay').classList.remove('show');
        });
    </script>
</body>
</html>
